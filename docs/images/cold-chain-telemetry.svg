<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="240" style="background:#090d16;border-radius:14px;border:2px solid #1e293b;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;">
  <defs>
    <linearGradient id="grid-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ecg-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes ecgPulse {
      0% { stroke-dashoffset: 880; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarPing {
      0% { r: 4px; opacity: 1; }
      100% { r: 18px; opacity: 0; }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
      50% { opacity: 0.35; filter: none; }
    }
    @keyframes scanSweep {
      0% { transform: translateX(0); }
      100% { transform: translateX(540px); }
    }
    .ecg-line {
      stroke-dasharray: 880;
      animation: ecgPulse 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .beacon-ring {
      animation: radarPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .live-dot {
      animation: blinkLed 1.4s ease-in-out infinite;
    }
  </style>

  <!-- Technical Background Grid -->
  <rect x="0" y="0" width="880" height="240" fill="url(#grid-grad)"/>
  <path d="M 0,40 L 880,40 M 0,80 L 880,80 M 0,120 L 880,120 M 0,160 L 880,160 M 0,200 L 880,200" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6"/>
  <path d="M 120,0 L 120,240 M 240,0 L 240,240 M 360,0 L 360,240 M 480,0 L 480,240 M 600,0 L 600,240 M 720,0 L 720,240" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6"/>

  <!-- Top Status Header -->
  <g transform="translate(24, 28)">
    <circle cx="8" cy="8" r="5" fill="#10b981" class="live-dot"/>
    <circle cx="8" cy="8" r="8" fill="none" stroke="#10b981" stroke-width="1.5" class="beacon-ring"/>
    <text x="24" y="12" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1.2">LIVE COLD-CHAIN TELEMETRY RADAR</text>
    <text x="320" y="12" fill="#64748b" font-size="11" font-family="monospace">INGEST BUFFER: 4001 • UDP/MQTT REAL-TIME</text>
  </g>

  <!-- Dynamic Temperature Wave / ECG Waveform -->
  <path d="M 24,140 L 140,140 L 160,110 L 180,165 L 200,90 L 220,150 L 240,140 L 340,140 L 360,115 L 380,160 L 400,95 L 420,145 L 440,140 L 520,140 L 540,120 L 560,155 L 580,85 L 600,150 L 620,140 L 700,140 L 720,125 L 740,150 L 760,100 L 780,140 L 856,140"
        fill="none" stroke="url(#ecg-glow)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neon-glow)" class="ecg-line"/>

  <!-- Sensor Telemetry Widget 1: mRNA ULT Cryo Vault -->
  <g transform="translate(24, 60)">
    <rect width="180" height="66" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#0284c7" stroke-width="1.5"/>
    <text x="14" y="22" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="0.8">VAULT PROBE #SN-ULT-09</text>
    <text x="14" y="48" fill="#38bdf8" font-size="22" font-weight="800" font-family="monospace">-82.4°C</text>
    <rect x="120" y="14" width="48" height="18" rx="4" fill="#0369a1" fill-opacity="0.4"/>
    <text x="126" y="27" fill="#7dd3fc" font-size="9" font-weight="700">OPTIMAL</text>
  </g>

  <!-- Sensor Telemetry Widget 2: Reefer Transit Fleet -->
  <g transform="translate(220, 60)">
    <rect width="180" height="66" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5"/>
    <text x="14" y="22" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="0.8">REEFER TRUCK FLEET #04</text>
    <text x="14" y="48" fill="#34d399" font-size="22" font-weight="800" font-family="monospace">+4.2°C</text>
    <rect x="120" y="14" width="48" height="18" rx="4" fill="#065f46" fill-opacity="0.5"/>
    <text x="126" y="27" fill="#6ee7b7" font-size="9" font-weight="700">IN-BAND</text>
  </g>

  <!-- Live Radar Map Corridor Marker Widget -->
  <g transform="translate(640, 52)">
    <rect width="216" height="80" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
    <text x="14" y="22" fill="#94a3b8" font-size="10" font-weight="600">CORRIDOR GPS RADAR</text>
    <circle cx="28" cy="50" r="12" fill="#0284c7" fill-opacity="0.2"/>
    <circle cx="28" cy="50" r="4" fill="#38bdf8" class="live-dot"/>
    <text x="50" y="46" fill="#f8fafc" font-size="11" font-weight="700">Transit Bay: BLR ➔ BOM</text>
    <text x="50" y="62" fill="#64748b" font-size="10" font-family="monospace">LAT 18.5204° N, 73.8567° E</text>
  </g>

  <!-- Bottom Ticker Metrics -->
  <g transform="translate(24, 212)">
    <text x="0" y="0" fill="#475569" font-size="10" font-weight="600">SAMPLE FREQUENCY: 5000ms</text>
    <text x="210" y="0" fill="#475569" font-size="10" font-weight="600">THERMAL EXCURSION RATE: 0.00%</text>
    <text x="460" y="0" fill="#475569" font-size="10" font-weight="600">ACTIVE PROBES: 5 NODES ONLINE</text>
    <text x="710" y="0" fill="#10b981" font-size="10" font-weight="700">● 21 CFR COMPLIANT</text>
  </g>
</svg>
