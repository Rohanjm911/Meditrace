<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="220" style="background:#090d16;border-radius:14px;border:2px solid #1e293b;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;">
  <defs>
    <linearGradient id="laser-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(100px); opacity: 1; }
      100% { transform: translateY(0); opacity: 0.6; }
    }
    @keyframes crosshairRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseTarget {
      0%, 100% { stroke: #06b6d4; stroke-width: 1.5; }
      50% { stroke: #10b981; stroke-width: 2.2; }
    }
    .scanner-laser {
      animation: laserSweep 2s ease-in-out infinite;
    }
    .hud-ring {
      transform-origin: 100px 110px;
      animation: crosshairRotate 16s linear infinite;
    }
  </style>

  <!-- Top Banner Header -->
  <g transform="translate(24, 25)">
    <circle cx="6" cy="6" r="4" fill="#14b8a6"/>
    <text x="20" y="10" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1.2">ZERO-TRUST OPTICAL GS1 DATAMATRIX SCANNER HUD</text>
    <text x="590" y="10" fill="#64748b" font-size="11" font-family="monospace">ZXING OPTICAL DECODER • WEBCAM STREAM</text>
  </g>

  <!-- Left: Optical Matrix Scanner Target Frame -->
  <g transform="translate(40, 50)">
    <rect width="120" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Target Corner Brackets -->
    <path d="M 8,24 L 8,8 L 24,8" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 112,24 L 112,8 L 96,8" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8,96 L 8,112 L 24,112" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 112,96 L 112,112 L 96,112" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Matrix Pattern Blocks -->
    <rect x="22" y="22" width="20" height="20" fill="#e2e8f0" rx="2"/>
    <rect x="50" y="22" width="10" height="10" fill="#e2e8f0" rx="1"/>
    <rect x="68" y="22" width="16" height="16" fill="#e2e8f0" rx="2"/>
    <rect x="22" y="50" width="12" height="12" fill="#e2e8f0" rx="1"/>
    <rect x="42" y="44" width="22" height="22" fill="#22d3ee" rx="2"/>
    <rect x="72" y="46" width="14" height="14" fill="#e2e8f0" rx="2"/>
    <rect x="22" y="72" width="18" height="18" fill="#e2e8f0" rx="2"/>
    <rect x="48" y="74" width="12" height="12" fill="#e2e8f0" rx="1"/>
    <rect x="68" y="68" width="18" height="18" fill="#e2e8f0" rx="2"/>

    <!-- Animated Laser Line Sweep -->
    <g class="scanner-laser" filter="url(#laser-glow)">
      <line x1="8" y1="10" x2="112" y2="10" stroke="#22d3ee" stroke-width="2"/>
      <rect x="8" y="8" width="104" height="4" fill="url(#laser-grad)"/>
    </g>
  </g>

  <!-- Middle: Deconstructed GS1 Application Identifiers -->
  <g transform="translate(190, 50)">
    <rect width="360" height="120" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    
    <text x="16" y="24" fill="#64748b" font-size="10" font-weight="700">DECONSTRUCTED GS1 APPLICATION IDENTIFIERS (AI)</text>
    
    <g transform="translate(16, 36)">
      <rect width="60" height="20" rx="4" fill="#1e293b"/>
      <text x="8" y="14" fill="#38bdf8" font-size="10" font-weight="700" font-family="monospace">(01) GTIN</text>
      <text x="70" y="14" fill="#e2e8f0" font-size="11" font-weight="600" font-family="monospace">00300010023456</text>
    </g>

    <g transform="translate(16, 62)">
      <rect width="60" height="20" rx="4" fill="#1e293b"/>
      <text x="8" y="14" fill="#38bdf8" font-size="10" font-weight="700" font-family="monospace">(17) EXP</text>
      <text x="70" y="14" fill="#e2e8f0" font-size="11" font-weight="600" font-family="monospace">2026-10-10</text>
    </g>

    <g transform="translate(16, 88)">
      <rect width="60" height="20" rx="4" fill="#1e293b"/>
      <text x="8" y="14" fill="#38bdf8" font-size="10" font-weight="700" font-family="monospace">(10) LOT</text>
      <text x="70" y="14" fill="#34d399" font-size="11" font-weight="700" font-family="monospace">VAC-2026-990A (Comirnaty mRNA)</text>
    </g>
  </g>

  <!-- Right: Verification Outcome Verdict Card -->
  <g transform="translate(580, 50)">
    <rect width="260" height="120" rx="10" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="1.8"/>
    
    <g transform="translate(18, 22)">
      <circle cx="10" cy="10" r="10" fill="#10b981"/>
      <path d="M 6,10 L 9,13 L 15,7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="14" fill="#6ee7b7" font-size="13" font-weight="800" letter-spacing="0.6">VERIFIED AUTHENTIC</text>
    </g>

    <text x="18" y="60" fill="#cbd5e1" font-size="11" font-weight="600">Zero-Trust Merkle Check: PASSED</text>
    <text x="18" y="78" fill="#94a3b8" font-size="10" font-family="monospace">Digital Signature: Valid &amp; Intact</text>
    <text x="18" y="94" fill="#94a3b8" font-size="10" font-family="monospace">Duplication Count: 1 of 4 (Normal)</text>
    
    <rect x="18" y="102" width="224" height="8" rx="4" fill="#065f46"/>
    <rect x="18" y="102" width="224" height="8" rx="4" fill="#10b981"/>
  </g>

  <!-- Bottom Ticker Metrics -->
  <g transform="translate(40, 202)">
    <text x="0" y="0" fill="#64748b" font-size="10">DECODE LATENCY: 42ms</text>
    <text x="180" y="0" fill="#64748b" font-size="10">SECURITY ATTESTATION: 21 CFR PART 11 NON-REPUDIATION</text>
    <text x="590" y="0" fill="#10b981" font-size="10" font-weight="700">● DISPENSE AUTHORIZED</text>
  </g>
</svg>
