<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" style="background:#070b12;border-radius:14px;border:2px solid #0f172a;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,0.3);">
  <defs>
    <linearGradient id="bg-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070b12" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="stream-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="particle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes transitPulse {
      0% { cx: 120px; }
      33% { cx: 360px; }
      66% { cx: 600px; }
      100% { cx: 840px; }
    }
    @keyframes pulseRing {
      0% { r: 5px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes lineFlow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes soundBar {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }

    .moving-particle {
      animation: transitPulse 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .beacon {
      animation: pulseRing 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .led {
      animation: blinkLed 1.2s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: lineFlow 1s linear infinite;
    }
    .bar-1 { animation: soundBar 0.9s ease-in-out infinite 0.1s; }
    .bar-2 { animation: soundBar 0.9s ease-in-out infinite 0.3s; }
    .bar-3 { animation: soundBar 0.9s ease-in-out infinite 0.2s; }
    .bar-4 { animation: soundBar 0.9s ease-in-out infinite 0.4s; }
  </style>

  <!-- Background Base & Grid -->
  <rect width="920" height="220" fill="url(#bg-glow)"/>
  <path d="M 0,36 L 920,36 M 0,185 L 920,185" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6"/>
  
  <!-- Header Bar -->
  <g transform="translate(24, 24)">
    <circle cx="6" cy="6" r="4" fill="#14b8a6" class="led"/>
    <circle cx="6" cy="6" r="7" fill="none" stroke="#14b8a6" stroke-width="1.2" class="beacon"/>
    <text x="22" y="10" fill="#f8fafc" font-size="11" font-weight="800" letter-spacing="1.2">LIVE SUPPLY CHAIN PROVENANCE PIPELINE</text>
    <text x="360" y="10" fill="#64748b" font-size="10" font-family="monospace">ACTIVE CONSENSUS: DEMO_INTEGRITY • MERKLE SEALED</text>
    <g transform="translate(800, -2)">
      <rect x="0" y="0" width="72" height="18" rx="4" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488" stroke-width="1"/>
      <text x="8" y="12" fill="#5eead4" font-size="9" font-weight="700" font-family="monospace">SYNCED</text>
    </g>
  </g>

  <!-- Connecting Transit Pipeline Lines -->
  <!-- Base track -->
  <path d="M 120,105 L 840,105" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Animated Gradient stream -->
  <path d="M 120,105 L 840,105" stroke="url(#stream-grad)" stroke-width="3" stroke-linecap="round" class="flow-line"/>

  <!-- Traveling Batch Packet Glow -->
  <circle cy="105" r="9" fill="#38bdf8" class="moving-particle" filter="url(#particle-glow)"/>
  <circle cy="105" r="4" fill="#ffffff" class="moving-particle"/>

  <!-- Node 1: Manufacturer -->
  <g transform="translate(120, 105)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#0d9488" stroke-width="2.5" filter="url(#glow-teal)"/>
    <circle cx="0" cy="0" r="14" fill="#134e4a"/>
    <!-- Pill/Factory Icon -->
    <path d="M -5,-5 L 5,5 M -7,1 L 1,-7" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
    
    <text x="0" y="44" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">1. Manufacturer</text>
    <text x="0" y="58" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">Formulate &amp; Mint</text>
    <text x="0" y="72" fill="#2dd4bf" font-size="9" font-family="monospace" text-anchor="middle">Block #108</text>
  </g>

  <!-- Node 2: Reefer Carrier -->
  <g transform="translate(360, 105)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#0c4a6e"/>
    <!-- Truck Icon -->
    <path d="M -7,2 L -7,-4 L 3,-4 L 7,0 L 7,2 Z M 3,2 L 3,-2 L 6,-2" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="-4" cy="4" r="1.5" fill="#38bdf8"/>
    <circle cx="4" cy="4" r="1.5" fill="#38bdf8"/>

    <text x="0" y="44" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">2. Reefer Logistics</text>
    <text x="0" y="58" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">Active IoT Telemetry</text>
    <text x="0" y="72" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">4.2°C (Safe 2-8°C)</text>
  </g>

  <!-- Node 3: Warehouse Depot -->
  <g transform="translate(600, 105)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#78350f"/>
    <!-- Vault/Warehouse Icon -->
    <path d="M -6,5 L -6,-2 L 0,-6 L 6,-2 L 6,5 Z" fill="none" stroke="#fbbf24" stroke-width="1.8"/>
    <line x1="-2" y1="5" x2="-2" y2="1" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="2" y1="5" x2="2" y2="1" stroke="#fbbf24" stroke-width="1.5"/>

    <text x="0" y="44" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">3. Central Depot Hub</text>
    <text x="0" y="58" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">Cryo Vault Intake</text>
    <text x="0" y="72" fill="#fbbf24" font-size="9" font-family="monospace" text-anchor="middle">-70°C Vault Normal</text>
  </g>

  <!-- Node 4: Retail Dispensary -->
  <g transform="translate(840, 105)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#064e3b"/>
    <!-- Checkmark Icon -->
    <path d="M -5,0 L -2,4 L 6,-4" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="0" y="44" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">4. Retail Dispensary</text>
    <text x="0" y="58" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">Zero-Trust Verified</text>
    <text x="0" y="72" fill="#34d399" font-size="9" font-family="monospace" text-anchor="middle">Dispensed to Patient</text>
  </g>

  <!-- Live Telemetry Footer Bars -->
  <g transform="translate(30, 198)">
    <text x="0" y="10" fill="#64748b" font-size="9" font-family="monospace">TELEMETRY AUDIO WAVEFORM:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="2" width="3" height="8" rx="1.5" fill="#14b8a6" class="bar-1"/>
      <rect x="6" y="2" width="3" height="12" rx="1.5" fill="#14b8a6" class="bar-2"/>
      <rect x="12" y="2" width="3" height="6" rx="1.5" fill="#14b8a6" class="bar-3"/>
      <rect x="18" y="2" width="3" height="15" rx="1.5" fill="#14b8a6" class="bar-4"/>
      <rect x="24" y="2" width="3" height="9" rx="1.5" fill="#14b8a6" class="bar-2"/>
    </g>
    <text x="480" y="10" fill="#64748b" font-size="9" font-family="monospace">END-TO-END CRYPTOGRAPHIC SHA-256 INTEGRITY: 100% VERIFIED</text>
  </g>
</svg>
